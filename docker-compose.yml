services:
  forecast-studio:
    build: .
    image: bnpl-forecast-engine:latest
    ports:
      # Only the loopback interface: nginx fronts this, the port is not public.
      - "127.0.0.1:8000:8000"
    environment:
      TZ: Asia/Tehran
    volumes:
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Static GitHub-Pages-style report, served from the same image so the
  # deployment needs no second registry pull.
  static-report:
    image: bnpl-forecast-engine:latest
    command:
      - python
      - -m
      - http.server
      - "8001"
      - --directory
      - /app/docs
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./docs:/app/docs:ro
    restart: unless-stopped
