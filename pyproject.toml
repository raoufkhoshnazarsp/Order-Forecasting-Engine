[project]
name = "bnpl-forecast-engine"
version = "0.1.0"
description = "BNPL Daily Order Forecasting Engine"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "jdatetime>=5.0",
    "openpyxl>=3.1",
    "pyarrow>=15.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
forecasting = [
    "statsforecast>=1.7",
    "mlforecast>=0.13",
    "lightgbm>=4.0",
    "hierarchicalforecast>=0.4",
    "ruptures>=1.1",
    "shap>=0.45",
]
serving = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
