# Target Definition — versioned business rule.
# null == NOT YET APPROVED BY BUSINESS. Engine must refuse to run
# production extraction while any required field is null.
target_definition:
  version: "target_v1_approved"
  definition_status: APPROVED   # DRAFT | APPROVED

  order_status: SETTLE
  merchant_type: ONLINE
  exclude_deleted: true     # business decision 2026-11-16: drop soft-deleted orders
  date_field: registered_date  # business decision 2026-11-16
  payment_methods: all      # all | [<list>]
  reversal_policy: exclude  # business decision 2026-11-16: reversed/refunded orders leave history
  # Statuses that mean "this order was reversed or refunded". With
  # order_status = SETTLE these are already excluded, but the predicate is
  # emitted explicitly so the decision is visible in the generated SQL.
  reversal_statuses: [REVERSED, REFUNDED, REFUND, REVERSAL]

  organic_rule:
    field: voucher_discount_amount
    operator: "== 0 OR IS NULL"

scope:
  verticals:
    - DIGITAL
    - FASHION
    - FMCG
    - GOLD
    - H&B
    - Home
    - Services
  venture_portfolio:
    enabled: true
  excluded_categories: []

monetary:
  source_unit: Rial
  reporting_unit: Toman
  divisor: 10
